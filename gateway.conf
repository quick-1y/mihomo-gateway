MIHOMO_PORT_DEFAULT="7890"
MIHOMO_API_PORT_DEFAULT="9090"

MIHOMO_IMAGE_DEFAULT="metacubex/mihomo:latest"
METACUBEXD_IMAGE_DEFAULT="ghcr.io/metacubex/metacubexd:latest"

# Optional: pre-fill subscription on a trusted/private repository only.
# SUBSCRIPTION_URL=""

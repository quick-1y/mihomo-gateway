mixed-port: 7890
allow-lan: true
bind-address: "*"

mode: rule
log-level: info
ipv6: false

external-controller: "0.0.0.0:9090"
secret: "__CLASH_SECRET__"

external-controller-cors:
  allow-origins:
    - "http://__LAN_IP__"
  allow-private-network: true

proxy-providers:
  subscription:
    type: http
    url: "__SUBSCRIPTION_URL__"
    path: ./proxy_providers/subscription.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      expected-status: 204

proxy-groups:
  - name: AUTO
    type: url-test
    include-all: true
    exclude-type: direct
    exclude-filter: "(?i)автовыбор|авто|auto|automatic|auto.?select"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    empty-fallback: COMPATIBLE

  - name: PROXY
    type: select
    proxies:
      - AUTO
      - DIRECT
    default-selected: AUTO

tun:
  enable: true
  stack: system
  auto-route: true
  # Required for this box's actual role: it's a gateway proxying OTHER LAN
  # devices' traffic, not just its own. auto-route alone (via ip routes/
  # rules) is sufficient for the host's own outbound connections, but a
  # genuinely FORWARDED connection from a LAN client needs the NAT redirect
  # rules auto-redirect sets up to be re-injected correctly — without it,
  # forwarded traffic gets pulled into the TUN and silently dropped instead
  # of being proxied or passed through DIRECT.
  auto-redirect: true
  # Pinned explicitly (rather than relying on whatever mihomo defaults to)
  # so the gateway firewall can allow-list this exact mark: auto-redirect's
  # own nftables table DNATs matched LAN traffic to a local destination for
  # mihomo to receive, which the kernel then re-classifies as INPUT-hook
  # (not FORWARD) traffic. The gateway's own default-deny "inet gateway"
  # input chain has no way to enumerate every possible proxied destination
  # port, so it instead accepts on this connection mark — see the
  # `meta mark ${MIHOMO_REDIRECT_MARK} accept` rule in write_nft_structural()
  # in install-gateway-docker.sh. Must stay in sync with that value.
  auto-redirect-input-mark: 0x100
  auto-redirect-output-mark: 0x200
  auto-detect-interface: true
  route-exclude-address:
    - __LAN_NETWORK__
    - 192.168.1.0/24
    - 1.1.1.1/32
    - 8.8.8.8/32

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

rule-providers:
  youtube:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/mvrvntn/routing@release/mihomo/youtube.mrs"
    path: ./ruleset/youtube.mrs
    interval: 86400
  discord:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/mvrvntn/routing@release/mihomo/discord.mrs"
    path: ./ruleset/discord.mrs
    interval: 86400
  discord-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/mvrvntn/routing@release/mihomo/discord-ip.mrs"
    path: ./ruleset/discord-ip.mrs
    interval: 86400
  telegram:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/mvrvntn/routing@release/mihomo/telegram.mrs"
    path: ./ruleset/telegram.mrs
    interval: 86400
  telegram-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/mvrvntn/routing@release/mihomo/telegram-ip.mrs"
    path: ./ruleset/telegram-ip.mrs
    interval: 86400
  ai:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/mvrvntn/routing@release/mihomo/ai.mrs"
    path: ./ruleset/ai.mrs
    interval: 86400
  category-geoblock-ru:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/mvrvntn/routing@release/mihomo/category-geoblock-ru.mrs"
    path: ./ruleset/category-geoblock-ru.mrs
    interval: 86400

rules:
  - RULE-SET,youtube,PROXY
  - RULE-SET,discord,PROXY
  - RULE-SET,discord-ip,PROXY,no-resolve
  - RULE-SET,telegram,PROXY
  - RULE-SET,telegram-ip,PROXY,no-resolve
  - RULE-SET,ai,PROXY
  - RULE-SET,category-geoblock-ru,PROXY
  - MATCH,DIRECT
